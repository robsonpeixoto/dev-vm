# lima dev-vm: GitHub identity, installed as ~/.ssh/config.d/10-github.conf.
# It is a drop-in, not a config: ~/.ssh/config belongs to your dotfiles, which
# must pull this in with `Include ~/.ssh/config.d/*.conf` near the top of it
# (ssh keeps the first value it sees for a keyword).
Host github.com
  User git
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
