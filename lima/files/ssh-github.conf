# lima dev-vm: GitHub identity provisioned by bin/create
Host github.com
  User git
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
  # The host keys are pinned in /etc/ssh/ssh_known_hosts, so nothing is ever
  # trusted on first use: an unknown or changed key must fail, not prompt.
  # GitHub's IPs rotate, so only the name is verified (OpenSSH's own default
  # since 8.5).
  StrictHostKeyChecking yes
  CheckHostIP no
