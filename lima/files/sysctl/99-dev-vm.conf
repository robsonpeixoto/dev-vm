# Every port is usable in the dev VM, including below 1024. The only Docker
# here is rootless, and rootless port publishing binds as the guest user, which
# the default start of 1024 would reject: docker run -p 80:80 fails with
# "bind: permission denied".
net.ipv4.ip_unprivileged_port_start=0

# ICMP from unprivileged processes, so `ping` works inside containers. Lima
# sets this in boot.Linux/20-rootless-base.sh, which plain mode skips.
net.ipv4.ping_group_range = 0 2147483647
