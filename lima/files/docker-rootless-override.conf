# Rootless Docker network driver: pasta instead of the slirp4netns default.
# pasta splices TCP connections instead of running a userspace TCP/IP stack,
# so container egress is faster; the implicit port driver is pasta's own and
# keeps published ports fast too. Still marked experimental upstream — deleting
# this file (and recreating the VM) falls back to slirp4netns.
[Service]
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_NET=pasta"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=implicit"
