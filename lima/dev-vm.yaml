# Isolated dev VM: no mounts, no port forwards, own IP via vzNAT.
# Rootless Docker provisioned for use inside the VM (no sudo, no docker group).
#   limactl start --name <name> ./lima/dev-vm.yaml
#   limactl shell <name>            # get IP: ip -4 addr
#   limactl delete -f <name>
minimumLimaVersion: "2.2.0"
# Pinned release, not template:_images/ubuntu-lts: that name is a symlink inside
# the installed Lima, so it floats and a Lima upgrade would move new VMs to the
# next LTS on its own. See "Guest OS" in README.md before bumping this.
base:
  - template:_images/ubuntu-26.04
vmType: vz
# devvm create overrides these from -cpus/-memory/-disk or settings.json.
cpus: 2
memory: 2GiB
disk: 50GiB
networks:
  - vzNAT: true
ssh:
  forwardAgent: false
# Plain mode: mounts, port forwards, containerd and the guest agent are all off.
# Provision scripts and probes still run. See https://lima-vm.io/docs/config/plain/
plain: false
mounts: []
containerd:
  system: false
  user: false
user:
  home: /home/{{.User}}
  shell: /usr/bin/zsh
param:
  # Dotfiles bare repo to check out over the guest $HOME. Empty disables it;
  # devvm create sets it from -dotfiles or ~/.config/dev-vm/settings.json.
  DOTFILES_REPO: ""
provision:
  # GitHub SSH access: private key generated/registered by devvm create, which
  # materializes this embedded tree into a temp dir and writes the key at
  # tmp/default before starting.
  - mode: data
    file:
      url: tmp/default
    path: "{{.Home}}/.ssh/id_ed25519"
    owner: "{{.User}}"
    permissions: "600"
    overwrite: true
  # The GitHub stanza is staged, then installed as a ~/.ssh/config.d drop-in by
  # ssh-config-user.sh. Nothing here writes ~/.ssh/config: that file belongs to
  # the dotfiles, which are responsible for loading every ssh config with
  # `Include ~/.ssh/config.d/*.conf`.
  - mode: data
    file:
      url: files/ssh-github.conf
    path: /usr/local/lib/dev-vm/ssh-github.conf
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # Rootless Docker socket for libraries that read DOCKER_HOST directly. Global,
  # not a dotfile: /etc/profile.d covers login shells (zsh reaches it through
  # /etc/zsh/zprofile), and zsh-system.sh wires /etc/zsh/zshenv to the same file
  # for every other zsh.
  - mode: data
    file:
      url: files/docker-host.sh
    path: /etc/profile.d/docker-host.sh
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # DEV_VM/DEV_VM_NAME markers, reaching every shell the same way.
  - mode: data
    file:
      url: files/dev-vm.sh
    path: /etc/profile.d/dev-vm.sh
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # ~/.cargo/bin (rustup shims) on PATH, reaching every shell the same way.
  # rust-user.sh installs rustup with --no-modify-path and relies on this.
  - mode: data
    file:
      url: files/rust.sh
    path: /etc/profile.d/rust.sh
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # Unprivileged ports from 0, so rootless Docker can publish 80/443 on the
  # guest IP; firewall-system.sh applies it with sysctl --system.
  - mode: data
    file:
      url: files/sysctl/99-dev-vm.conf
    path: /etc/sysctl.d/99-dev-vm.conf
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # Turns Ubuntu's periodic apt work off; the script below masks the matching
  # timers. Upgrading the guest is a manual apt-get upgrade.
  - mode: data
    file:
      url: files/apt/99dev-vm-no-auto-upgrades
    path: /etc/apt/apt.conf.d/99dev-vm-no-auto-upgrades
    owner: "root:root"
    permissions: "644"
    overwrite: true
  - mode: data
    file:
      url: files/my-ip
    path: /usr/local/bin/my-ip
    owner: "root:root"
    permissions: "755"
    overwrite: true
  - mode: data
    file:
      url: files/install-neovim
    path: /usr/local/lib/dev-vm/install-neovim
    owner: "root:root"
    permissions: "755"
    overwrite: true
  # Repositories to clone in the guest, from the "clone" entry of
  # ~/.config/dev-vm/settings.json. devvm create renders one
  # "<basedir>\t<org>/<repo>" line per repository into the temp tree it starts
  # from; with the setting absent the file holds only its comment header and
  # clone-user.sh does nothing.
  - mode: data
    file:
      url: tmp/clone-list
    path: /usr/local/lib/dev-vm/clone-list
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # mkcert root CA, staged for mkcert-user.sh to install into the guest CAROOT.
  # devvm create writes both files into the temp tree it starts from — from the
  # host `mkcert -CAROOT` with "mkcert": true in settings.json, empty
  # otherwise — and adds the host rootCA.pem to caCerts.files so cloud-init
  # trusts it system-wide. The key is owned by the guest user: the user script
  # that installs it cannot read a root-only file.
  - mode: data
    file:
      url: tmp/rootCA.pem
    path: /usr/local/lib/dev-vm/rootCA.pem
    owner: "root:root"
    permissions: "644"
    overwrite: true
  - mode: data
    file:
      url: tmp/rootCA-key.pem
    path: /usr/local/lib/dev-vm/rootCA-key.pem
    owner: "{{.User}}"
    permissions: "600"
    overwrite: true
  # xterm-ghostty terminfo source, compiled by ghostty-terminfo-system.sh.
  # devvm create dumps it with Homebrew's infocmp into the temp tree it starts
  # from when settings.json has "ghostty": true, and writes an empty file
  # otherwise. base64, because Lima runs data content through a Go template and
  # the entry's acsc capability contains doubled braces it would read as an
  # action.
  - mode: data
    file:
      url: tmp/xterm-ghostty.terminfo.b64
    path: /usr/local/lib/dev-vm/xterm-ghostty.terminfo.b64
    owner: "root:root"
    permissions: "644"
    overwrite: true
  # First system script: the guest must be reachable on every port at its own IP
  # before anything else configures itself.
  - mode: system
    file:
      url: scripts/firewall-system.sh
  # Restores what plain mode drops: subuid/subgid, cgroup delegation and
  # linger, all prerequisites of the rootless daemon set up below.
  - mode: system
    file:
      url: scripts/rootless-base-system.sh
  - mode: system
    file:
      url: scripts/docker-system.sh
  - mode: system
    file:
      url: scripts/git-system.sh
  - mode: system
    file:
      url: scripts/go-system.sh
  - mode: system
    file:
      url: scripts/zsh-system.sh
  - mode: system
    file:
      url: scripts/mise-system.sh
  - mode: system
    file:
      url: scripts/neovim-system.sh
  - mode: system
    file:
      url: scripts/packages-system.sh
  - mode: system
    file:
      url: scripts/ghostty-terminfo-system.sh
  - mode: system
    file:
      url: scripts/no-auto-upgrades-system.sh
  # known_hosts is user state: `boot` mode would run as root, before this user
  # exists, and write /root/.ssh/known_hosts instead.
  - mode: user
    file:
      url: scripts/ssh-known-hosts.sh
  # Same reason: the drop-in and its directory are user state under ~/.ssh.
  - mode: user
    file:
      url: scripts/ssh-config-user.sh
  # Before dotfiles.sh: the installer writes a stock ~/.zshrc that a dotfiles
  # checkout then replaces with the real one.
  - mode: user
    file:
      url: scripts/omz-user.sh
  - mode: user
    file:
      url: scripts/dotfiles.sh
  - mode: user
    file:
      url: scripts/docker-user.sh
  # After dotfiles.sh: the checkout delivers the mise config and ~/.zshrc that
  # this script trusts, installs from, and appends to.
  - mode: user
    file:
      url: scripts/mise-user.sh
  # The Rust toolchain neovim plugins with a Rust component build against,
  # blink.cmp among them. Per-user, because rustup owns ~/.rustup and ~/.cargo.
  - mode: user
    file:
      url: scripts/rust-user.sh
  # After mise-user.sh: mkcert itself usually comes from mise, so by now the
  # binary can answer `mkcert -CAROOT`.
  - mode: user
    file:
      url: scripts/mkcert-user.sh
  # Last user script: cloning needs the ssh key, known_hosts and git that the
  # steps above put in place.
  - mode: user
    file:
      url: scripts/clone-user.sh
probes:
  - mode: readiness
    description: rootless docker daemon is up
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if ! timeout 60s bash -c "until docker info >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "rootless docker is not responding"
        exit 1
      fi
    hint: |
      Rootless Docker did not come up. Check it in the guest with:
        limactl shell {{.Name}} systemctl --user status docker
        limactl shell {{.Name}} journalctl --user -u docker
      Setup happens in lima/scripts/docker-user.sh.
  - mode: readiness
    description: github.com accepts the provisioned ssh key
    script: |
      #!/bin/bash
      set -eu -o pipefail
      # `ssh -T git@github.com` exits 1 even on success, so match the greeting.
      if ! timeout 60s bash -c 'until ssh -o BatchMode=yes -T git@github.com 2>&1 | grep -q "successfully authenticated"; do sleep 3; done'; then
        echo >&2 "github.com did not accept the ssh key"
        exit 1
      fi
    hint: |
      GitHub SSH authentication failed. The key is generated and registered by
      devvm create; recreate it with:
        go run . create {{.Name}} -create-ssh-key
      A missing admin:public_key token scope is the usual cause:
        gh auth refresh -h github.com -s admin:public_key
