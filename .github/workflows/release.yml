name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="dev-vm_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "build/${NAME}" dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "build/${NAME}/dev-vm" .
          cp README.md "build/${NAME}/"
          cp -R completions "build/${NAME}/"
          tar -C build -czf "dist/${NAME}.tar.gz" "${NAME}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-vm_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -eux
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: robsonpeixoto/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: bump formula
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p checksums.txt -D "$RUNNER_TEMP"
          python3 - "$VERSION" "$RUNNER_TEMP/checksums.txt" <<'PY'
          import pathlib, re, sys

          version, checksums = sys.argv[1], sys.argv[2]
          formula = pathlib.Path("Formula/dev-vm.rb")
          text = formula.read_text()
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text, count=1)

          for line in pathlib.Path(checksums).read_text().splitlines():
              sha, name = line.split()
              platform = name.removeprefix(f"dev-vm_{version}_").removesuffix(".tar.gz")
              pattern = rf'(_{platform}\.tar\.gz"[^\n]*\n[^\n]*\n\s*sha256 ")[0-9a-f]{{64}}'
              text, count = re.subn(pattern, rf'\g<1>{sha}', text, count=1)
              if count != 1:
                  raise SystemExit(f"no sha256 to update for {platform}")

          formula.write_text(text)
          PY
      - name: commit
        run: |
          set -eux
          git diff --quiet Formula/dev-vm.rb && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-gpg-sign -m "chore: dev-vm ${GITHUB_REF_NAME}" Formula/dev-vm.rb
          git push
